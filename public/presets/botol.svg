<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f8fafc" />
  <!-- Tumbler Body -->
  <defs>
    <linearGradient id="tumblerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="40%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  <!-- Cap -->
  <rect x="170" y="45" width="60" height="25" rx="5" fill="#334155" />
  <rect x="180" y="32" width="40" height="15" rx="4" fill="#64748b" />
  <!-- Body -->
  <path d="M 155 70 L 245 70 L 235 220 Q 200 230 165 220 Z" fill="url(#tumblerGrad)" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.12))" />
  <!-- Grip Rubber Ring -->
  <rect x="160" y="115" width="80" height="28" rx="4" fill="#1e293b" opacity="0.6" />
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">Botol Minum / Tumbler</text>
</svg>
