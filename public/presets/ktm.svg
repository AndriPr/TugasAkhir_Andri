<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" />
  <!-- Card Base -->
  <rect x="50" y="40" width="300" height="190" rx="16" fill="url(#cardGrad)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))" />
  <!-- Card Header -->
  <rect x="75" y="65" width="40" height="40" rx="20" fill="#fbbf24" />
  <rect x="125" y="70" width="140" height="12" rx="4" fill="#ffffff" opacity="0.9" />
  <rect x="125" y="90" width="90" height="8" rx="3" fill="#93c5fd" />
  <!-- Chip -->
  <rect x="75" y="125" width="45" height="35" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  <!-- Photo placeholder -->
  <rect x="260" y="110" width="65" height="85" rx="6" fill="#ffffff" opacity="0.85" />
  <circle cx="292.5" cy="140" r="16" fill="#94a3b8" />
  <path d="M 272 185 A 22 18 0 0 1 313 185 Z" fill="#94a3b8" />
  <!-- Text lines -->
  <rect x="75" y="175" width="160" height="10" rx="3" fill="#ffffff" opacity="0.85" />
  <rect x="75" y="195" width="110" height="8" rx="3" fill="#bfdbfe" />
  <!-- Caption -->
  <text x="200" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">Kartu Tanda Mahasiswa (KTM)</text>
</svg>
